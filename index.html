<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#deebf7" />
  <title>הארון של מאיהלי</title>
  <meta name="description" content="פריטים יפים שמחפשים ארון חדש ♡" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="hero">
      <h1>הארון של מאיהלי</h1>
      <p class="pickup">📍 איסוף מבת גלים</p>
      <img class="hero-art" src="images/hero.jpg" alt="מאיהלי" width="1124" height="746" />
      <a class="discover" href="#closet">DISCOVER THE COLLECTION</a>
    </header>
  <main class="wrap">

    <section id="closet">
      <h2>הארון של מאיהלי <small id="count"></small></h2>

      <div class="chips" id="categories" role="tablist"></div>

      <div class="filters">
        <input id="search" type="search" placeholder="חיפוש פריט..." enterkeyhint="search" />
        <select id="availability" aria-label="זמינות">
          <option value="available">זמינים בלבד</option>
          <option value="all">כל הפריטים</option>
          <option value="sold">נמכרו</option>
        </select>
      </div>

      <p class="hint">לחיצה על פריט מוסיפה אותו לבחירה ♡ מחירי ברירת המחדל נקבעו לפי סוג הפריט.</p>

      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>לא נמצאו פריטים</p>
    </section>

    <footer>
      <a id="chat" class="chat" target="_blank" rel="noopener">דברי איתי בוואטסאפ ♡</a>
      <p>A second chance. ♡</p>
    </footer>
  </main>

  <div class="sendbar" id="sendbar" hidden>
    <div class="sendbar-info">
      <strong id="sel-count"></strong>
      <span id="sel-total"></span>
      <button type="button" id="clear" class="link">ניקוי</button>
    </div>
    <button type="button" id="send" class="send">SEND</button>
  </div>

  <script src="items.js"></script>
  <script src="app.js"></script>
</body>
</html>
